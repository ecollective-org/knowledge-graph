name: Publish

# On a `v*` tag: verify, check that the tag names the version in package.json, then publish to
# npmjs.com under the `ecollective` organisation, public, as `publishConfig` in package.json says.
#
# Authentication, in two phases (issue #2):
#  1. First publish: a granular access token scoped to the `@ecollective` scope with
#     "Read and write (publish and stage)" and "Bypass 2FA", stored as the repository secret
#     NPM_TOKEN. The owner creates it; nothing here can.
#  2. Afterwards: trusted publishing (OIDC). Once the package exists, the owner registers this
#     repository and this workflow file as its trusted publisher on npmjs.com and sets the package
#     to "Require two-factor authentication and disallow tokens". The `id-token: write` permission
#     and a current npm are already in place for that; NPM_TOKEN is then revoked and this workflow
#     needs no secret at all.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use a current npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@latest && npm --version

      - name: The tag must equal the package version (consumers pin by exact version, EKG-SPEC-82)
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version (${expected})" >&2
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Typecheck, test, build
        run: npm run verify

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish

# On a `v*` tag: verify, check that the tag names the version in package.json, then publish to
# npmjs.com, public, under the `ecollective` organisation (`publishConfig` in package.json).
#
# Authentication is npm trusted publishing (OIDC): this repository and this workflow file are the
# package's registered trusted publisher on npmjs.com, publishing access there is "Require
# two-factor authentication and disallow tokens", and no secret is involved (issue #2). The
# `id-token: write` permission and a current npm (11.5.1 or later) are what npm needs for it.
#
# Provenance: under trusted publishing npm attaches a provenance attestation automatically, but
# only a public repository can carry one, so it is switched off while this repository is private
# and turns on by itself when the repository becomes public.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use a current npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@latest && npm --version

      - name: The tag must equal the package version (consumers pin by exact version, EKG-SPEC-82)
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version (${expected})" >&2
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Typecheck, test, build
        run: npm run verify

      - name: Publish (trusted publishing; provenance only from a public repository)
        run: npm publish
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}

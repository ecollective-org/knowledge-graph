name: CI

# Every pull request and every push to main: install exactly what the lockfile says, then run
# `npm run verify` (typecheck, tests, build) on the oldest supported Node and the current LTS.
# The consumers build on Node 20 (Amplify Hosting) and test on 22 (their own CI), so both are
# covered here. `npm pack --dry-run` lists what a consumer would receive, so a file missing from
# `package.json` `files` shows up in the log rather than in a consumer's build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck, test, build
        run: npm run verify

      - name: Pack (dry run)
        run: npm pack --dry-run
